# The front door: certificates from Let's Encrypt, and every request passed on to notefeed (../notefeed) over the shared
# network `edge`, which exists before either is started.
services:
  caddy:
    image: caddy:2.11.7
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/config:/config
    networks:
      - edge

networks:
  edge:
    external: true
