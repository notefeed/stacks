# The front door: certificates from Let's Encrypt, and every request passed on to notefeed (../notefeed).
#
# On the host's network, not on a Docker one: behind Docker's port publishing, a request that arrives over IPv6 looks
# as if it came from Docker itself, and notefeed's rate limit would then count every IPv6 visitor as one. Here Caddy
# sees the real address of every client. It reaches notefeed on this server's private address.
services:
  caddy:
    image: caddy:2.11.7
    container_name: caddy
    # Monitored by Uptime Kuma (see ../collectors): the site as a visitor reaches it, and the name with www in front.
    labels:
      kuma.site.http.name: ${SITE_HOST}
      kuma.site.http.url: https://${SITE_HOST}/
      kuma.site.http.parent_name: host-group
      kuma.www.http.name: www.${SITE_HOST}
      kuma.www.http.url: https://www.${SITE_HOST}/
      kuma.www.http.parent_name: host-group
      # The documentation is not on this server (GitHub Pages); it is watched from here so that it is watched at all.
      kuma.docs.http.name: docs.${SITE_HOST}
      kuma.docs.http.url: https://docs.${SITE_HOST}/
      kuma.docs.http.parent_name: host-group
      kuma.docs.http.interval: 300
      # The report form, as a visitor reaches it.
      kuma.report.http.name: report.${SITE_HOST}
      kuma.report.http.url: https://report.${SITE_HOST}/
      kuma.report.http.parent_name: host-group
    restart: unless-stopped
    network_mode: host
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./access-log.caddy:/etc/caddy/access-log.caddy:ro
      - ./data/caddy:/data
      - ./data/config:/config
