# The collecting side, the same on every server that is monitored: Alloy ships the containers' logs to Loki and the
# machine's CPU, memory, disk, network and backup units to Prometheus, the Beszel
# agent answers the hub's questions about the machine. Both talk over the private network only.
services:
  alloy:
    image: grafana/alloy:v1.21.2
    container_name: alloy
    restart: unless-stopped
    # The host's network, so the collector `netdev` counts the server's interfaces and not the container's own (/proc/net is
    # the reading process's). Alloy's own HTTP server stays on 127.0.0.1:12345.
    network_mode: host
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
    environment:
      LOKI_URL: ${LOKI_URL:?where Loki listens, e.g. http://10.0.0.2:3100}
      PROMETHEUS_URL: ${PROMETHEUS_URL:?where Prometheus listens, e.g. http://10.0.0.2:9090}
      PRODUCT: ${PRODUCT:?the product this server belongs to}
      HOST_NAME: ${HOST_NAME:?this server's name}
      PRIVATE_IP: ${PRIVATE_IP:?this server's address on the private network}
      NOTEFEED_METRICS_TOKEN: ${NOTEFEED_METRICS_TOKEN:?the token of notefeed's /metrics}
      # JSON: [] while healthchecks is not set up (Ansible writes it).
      HEALTHCHECKS_TARGETS: ${HEALTHCHECKS_TARGETS:-[]}
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # The host as it is, read-only, for the machine's numbers.
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
      # The host's systemd, read-only, for the backup units' state (config.alloy, the collector `systemd`).
      - /run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
      - alloy:/var/lib/alloy/data

  # Started only with the profile `beszel`, once the hub's key is known (the hub shows it when the server is added).
  beszel-agent:
    image: henrygd/beszel-agent:0.21.0
    container_name: beszel-agent
    restart: unless-stopped
    profiles: ["beszel"]
    network_mode: host
    environment:
      # On the private address only: the hub connects here, nobody else can.
      LISTEN: ${PRIVATE_IP:?this server's address on the private network}:45876
      # The hub's public key, shown when the system is added in Beszel.
      KEY: ${BESZEL_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data/beszel-agent:/var/lib/beszel-agent

  # PostgreSQL in depth for the operator dashboard (notefeed/ansible#21): cache hits, locks, vacuum, long transactions. Started
  # only with the profile `postgres`, once the login `monitor` (pg_monitor: reads statistics, no data) has its password. On
  # notefeed's network, where the database is; its numbers on 127.0.0.1:9187 for Alloy. Only on the notefeed server.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    container_name: postgres-exporter
    restart: unless-stopped
    profiles: ["postgres"]
    mem_limit: 128m
    environment:
      DATA_SOURCE_URI: db:5432/notefeed?sslmode=disable
      DATA_SOURCE_USER: monitor
      DATA_SOURCE_PASS: ${POSTGRES_MONITOR_PASSWORD:-}
    command:
      # The vacuum and dead rows of each of notefeed's tables; the per-setting numbers are many and say little.
      - --collector.stat_user_tables
      - --no-collector.settings
    ports:
      - "127.0.0.1:9187:9187"
    networks:
      - notefeed

  # AutoKuma turns the `kuma.*` labels of this server's containers into monitors in the Uptime Kuma on the monitoring
  # server, and removes a monitor when its container is removed. Started only with the profile `autokuma`, once Uptime
  # Kuma has its account. Each server brings its own notification, so no server depends on what another one defined.
  autokuma:
    # A pre-release on purpose: 2.0.0 never reconnects after Uptime Kuma restarts and then applies nothing, silently
    # (BigBoot/AutoKuma#157). Go to 2.1.0 once it is released.
    image: ghcr.io/bigboot/autokuma:2.1.0-rc.2
    container_name: autokuma
    restart: unless-stopped
    profiles: ["autokuma"]
    mem_limit: 512m
    environment:
      AUTOKUMA__KUMA__URL: ${KUMA_URL:-}
      AUTOKUMA__KUMA__USERNAME: ${KUMA_USERNAME:-}
      AUTOKUMA__KUMA__PASSWORD: ${KUMA_PASSWORD:-}
      AUTOKUMA__DOCKER__LABEL_PREFIX: kuma
      # Every monitor alerts. A monitor made through the API has no notification unless it is named here.
      AUTOKUMA__DEFAULT_SETTINGS: |-
        *.notification_name_list: ["ntfy"]
        http.interval: 60
        http.max_retries: 2
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - autokuma:/data
    labels:
      # One group per server in Uptime Kuma. A monitor joins it with `parent_name: host-group`.
      kuma.host-group.group.name: ${HOST_NAME}
      # The group itself stays quiet: its monitors alert, and one outage should be one message.
      kuma.host-group.group.notification_name_list: "[]"
      # Alerts go to a topic at ntfy.sh. The topic's name is the only secret, so a message says no more than what is down.
      kuma.ntfy.notification.name: ntfy (${HOST_NAME})
      kuma.ntfy.notification.active: "true"
      kuma.ntfy.notification.config: '{"type":"ntfy","ntfyserverurl":"https://ntfy.sh","ntfytopic":"${NTFY_TOPIC:-}","ntfyPriority":5,"ntfyAuthenticationMethod":"none"}'

volumes:
  alloy:
  autokuma:

# notefeed's own network (../notefeed), for the exporter to reach the database.
networks:
  notefeed:
    name: notefeed
    external: true
