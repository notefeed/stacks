# The collecting side, the same on every server that is monitored: Fluent Bit ships the containers' logs to VictoriaLogs and
# the machine's CPU, memory, disk, network and backup units to VictoriaMetrics, the Beszel
# agent answers the hub's questions about the machine. Both talk over the private network only.
services:
  # Container logs to VictoriaLogs and the server's numbers to VictoriaMetrics on the monitoring server (./fluent-bit; in place
  # of Alloy since 2026-11). notefeed's /metrics, PostgreSQL and healthchecks VictoriaMetrics scrapes itself over the private
  # network.
  fluent-bit:
    image: cr.fluentbit.io/fluent/fluent-bit:4.0.3
    container_name: fluent-bit
    restart: unless-stopped
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/fluent-bit.yaml"]
    # The host's process view: the filesystem collector reads the mount table of PID 1, so it reports the server's disks, not
    # the container's (MarcelBruckner-Homelab/homelab#590).
    pid: host
    # Its health (/api/v1/health, 500 once its outputs keep failing), for Gatus on the monitoring server.
    ports:
      - "${PRIVATE_IP:?this server's address on the private network}:2020:2020"
    mem_limit: 128m
    environment:
      VICTORIA_HOST: ${VICTORIA_HOST:?the monitoring server's private address, where VictoriaMetrics and VictoriaLogs listen}
      HOST_NAME: ${HOST_NAME:?this server's name}
      PRODUCT: ${PRODUCT:?the product this server belongs to}
      # A container of one of these Compose projects carries the project as its product.
      PRODUCT_PROJECTS: ${PRODUCT_PROJECTS:-}
      NODE_METRICS: cpu,meminfo,vmstat,filesystem,loadavg,diskstats,netdev,systemd
      # The backup units, for the backup age on the dashboards and the alerts: their names and state, never what they hold.
      SYSTEMD_UNITS: (notefeed|gamepanion|upload)-(dump-.+|offsite)\.(service|timer)
    volumes:
      - ./fluent-bit/fluent-bit.yaml:/fluent-bit/etc/fluent-bit.yaml:ro
      - ./fluent-bit/shape.lua:/fluent-bit/etc/shape.lua:ro
      - ./data/fluent-bit:/state
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # systemd over the host's D-Bus; at /run, where the collector looks (not /var/run).
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket:ro
  beszel-agent:
    image: henrygd/beszel-agent:0.21.0
    container_name: beszel-agent
    restart: unless-stopped
    profiles: ["beszel"]
    network_mode: host
    environment:
      # On the private address only: the hub connects here, nobody else can.
      LISTEN: ${PRIVATE_IP:?this server's address on the private network}:45876
      # The hub's public key, shown when the system is added in Beszel.
      KEY: ${BESZEL_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data/beszel-agent:/var/lib/beszel-agent

  # PostgreSQL in depth for the operator dashboard (notefeed/ansible#21): cache hits, locks, vacuum, long transactions. Started
  # only with the profile `postgres`, once the login `monitor` (pg_monitor: reads statistics, no data) has its password. On
  # notefeed's network, where the database is; its numbers on the private address :9187, for VictoriaMetrics on the monitoring server. Only on the notefeed server.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.21.1
    container_name: postgres-exporter
    restart: unless-stopped
    profiles: ["postgres"]
    mem_limit: 128m
    environment:
      DATA_SOURCE_URI: db:5432/notefeed?sslmode=disable
      DATA_SOURCE_USER: monitor
      DATA_SOURCE_PASS: ${POSTGRES_MONITOR_PASSWORD:-}
    command:
      # The vacuum and dead rows of each of notefeed's tables; the per-setting numbers are many and say little.
      - --collector.stat_user_tables
      - --no-collector.settings
    ports:
      # VictoriaMetrics on the monitoring server scrapes it over the private network.
      - "${PRIVATE_IP}:9187:9187"
    networks:
      - notefeed

# notefeed's own network (../notefeed), for the exporter to reach the database.
networks:
  notefeed:
    name: notefeed
    external: true
