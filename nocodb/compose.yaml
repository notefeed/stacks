# NocoDB: where reports about content on notefeed.me land (notefeed/notefeed #156). One container with its own SQLite
# database in ./data; the public report form and the operator's login are both served under report.<site>, by Caddy
# (../caddy). notefeed's "Report" link (NOTEFEED_REPORT_URL in ../notefeed) opens the form with the note's ids filled in.
# What the table, the form and the webhook look like is in README.md next to this file: they are made in NocoDB's UI.
services:
  nocodb:
    image: nocodb/nocodb:2026.09.1
    container_name: nocodb
    # Monitored by Uptime Kuma through Caddy's labels (../caddy): the form's host as a visitor reaches it.
    restart: unless-stopped
    env_file: .env
    environment:
      # Its own address, for the links it writes.
      NC_PUBLIC_URL: https://report.${SITE_HOST}
      NC_SITE_URL: https://report.${SITE_HOST}
      # The operator's account, made at the first start; the password can be changed in the UI afterwards.
      NC_ADMIN_EMAIL: ${NC_ADMIN_EMAIL:?the operator's login}
      NC_ADMIN_PASSWORD: ${NC_ADMIN_PASSWORD:?the operator's password}
      NC_AUTH_JWT_SECRET: ${NC_AUTH_JWT_SECRET:?signs the sessions}
      # Nobody signs up; the operator is the only account.
      NC_INVITE_ONLY_SIGNUP: "true"
      NC_DISABLE_TELE: "true"
    volumes:
      - ./data:/usr/app/data
    ports:
      - "${PRIVATE_IP:?this server's address on the private network}:8080:8080"
